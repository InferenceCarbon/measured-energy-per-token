<svg xmlns="http://www.w3.org/2000/svg" width="820" height="778" viewBox="0 0 820 778"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="820" height="778" fill="#ffffff"/><text x="10" y="20.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Every run</text><rect x="10" y="30" width="124" height="46" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/><text x="72.0" y="57.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="middle">Idle, 60 s</text><rect x="138" y="30" width="124" height="46" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/><text x="200.0" y="49.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="middle">Warm-up: up to</text><text x="200.0" y="65.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="middle">4 requests</text><rect x="266" y="30" width="420" height="46" rx="4" fill="#e4f3ea" stroke="#2e7d4f" stroke-width="1.4"/><text x="476.0" y="49.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d4f" font-weight="bold" text-anchor="middle">Metered window: at least 60 s and 20,000</text><text x="476.0" y="65.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d4f" font-weight="bold" text-anchor="middle">tokens, then requests in flight finish</text><rect x="690" y="30" width="126" height="46" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/><text x="753.0" y="57.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="middle">Idle, 60 s</text><text x="10" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">Energy = the GPU's energy counter at the end of the window minus at its start, summed over the GPUs,</text><text x="10" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">then divided by the window's tokens. Most configurations ran twice, on two pods where two were available.</text><text x="10" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">A decode request</text><rect x="10" y="156" width="250" height="28" rx="3" fill="#c9d9ee" stroke="none" stroke-width="1.2"/><text x="135" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="middle">cached prefix: 1,024 tokens</text><rect x="264" y="156" width="74" height="28" rx="3" fill="#f2c79b" stroke="none" stroke-width="1.2"/><text x="301" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="middle">fresh: 200</text><line x1="344" y1="170" x2="370" y2="170" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/><rect x="376" y="156" width="130" height="28" rx="3" fill="#bfe3cc" stroke="none" stroke-width="1.2"/><text x="441" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="middle">output: 256 tokens</text><text x="522" y="166.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">The prefix is cached before the window;</text><text x="522" y="181.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">the fresh input is read inside it.</text><text x="10" y="222.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">The ten experiments</text><rect x="10" y="234" width="258" height="166" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/><rect x="22" y="246" width="25.0" height="17" rx="8.5" fill="#2e7d4f" stroke="none" stroke-width="1.2"/><text x="34.5" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">c0</text><text x="54.0" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Loaded idle</text><text x="22" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">What does a GPU draw while holding</text><text x="22" y="301.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">a model and doing nothing?</text><text x="22" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">Nothing varied: a fixed 60 s window</text><line x1="22" y1="375" x2="256" y2="375" stroke="#d0d7de" stroke-width="1"/><text x="22" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">16 runs · Section 4.1</text><rect x="281" y="234" width="258" height="166" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/><rect x="293" y="246" width="25.0" height="17" rx="8.5" fill="#2e7d4f" stroke="none" stroke-width="1.2"/><text x="305.5" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">c1</text><text x="325.0" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Batch</text><text x="293" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">How does energy per token change</text><text x="293" y="301.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">with the batch?</text><text x="293" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">Target batch 1, 4, 16, 64, 256;</text><text x="293" y="341.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">1k cached, 200 fresh, 256 out</text><line x1="293" y1="375" x2="527" y2="375" stroke="#d0d7de" stroke-width="1"/><text x="293" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">80 runs · Sections 4.2, 4.3</text><rect x="552" y="234" width="258" height="166" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/><rect x="564" y="246" width="25.0" height="17" rx="8.5" fill="#2e7d4f" stroke="none" stroke-width="1.2"/><text x="576.5" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">c2</text><text x="596.0" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Context</text><text x="564" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">How does it change with the context</text><text x="564" y="301.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">read back?</text><text x="564" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">Cached context 1k, 4k, 16k, model</text><text x="564" y="341.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">maximum; target batch 8, 64</text><line x1="564" y1="375" x2="798" y2="375" stroke="#d0d7de" stroke-width="1"/><text x="564" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">141 runs · Section 4.4</text><rect x="10" y="412" width="258" height="166" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/><rect x="22" y="424" width="25.0" height="17" rx="8.5" fill="#2e7d4f" stroke="none" stroke-width="1.2"/><text x="34.5" y="437.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">c3</text><text x="54.0" y="441.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Prefill, cache off</text><text x="22" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">What does reading a prompt cost</text><text x="22" y="479.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">per token?</text><text x="22" y="504.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">Fresh prompt 1k, 4k, 16k, model</text><text x="22" y="519.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">maximum; target batch 1, 8; one</text><text x="22" y="534.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">output token</text><line x1="22" y1="553" x2="256" y2="553" stroke="#d0d7de" stroke-width="1"/><text x="22" y="569.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">144 runs · Section 4.5</text><rect x="281" y="412" width="258" height="166" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/><rect x="293" y="424" width="25.0" height="17" rx="8.5" fill="#2e7d4f" stroke="none" stroke-width="1.2"/><text x="305.5" y="437.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">c4</text><text x="325.0" y="441.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Cached prefix</text><text x="293" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">How much does reusing a cached</text><text x="293" y="479.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">prompt save?</text><text x="293" y="504.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">Cached 1k, 4k, 16k; fresh 200 or</text><text x="293" y="519.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">2,048; batch 1, 8; against an</text><text x="293" y="534.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">all-fresh control of equal length</text><line x1="293" y1="553" x2="527" y2="553" stroke="#d0d7de" stroke-width="1"/><text x="293" y="569.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">384 runs · Section 4.6</text><rect x="552" y="412" width="258" height="166" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/><rect x="564" y="424" width="25.0" height="17" rx="8.5" fill="#2e7d4f" stroke="none" stroke-width="1.2"/><text x="576.5" y="437.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">c6</text><text x="596.0" y="441.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Tensor parallelism</text><text x="564" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">What does splitting a model over</text><text x="564" y="479.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">more GPUs cost?</text><text x="564" y="504.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">1 to 2 GPUs (Qwen3-8B), 2 to 4</text><text x="564" y="519.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">(Llama-3.3-70B); batch 1, 16, 64</text><line x1="564" y1="553" x2="798" y2="553" stroke="#d0d7de" stroke-width="1"/><text x="564" y="569.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">48 runs · Sections 4.3, 4.7</text><rect x="10" y="590" width="258" height="166" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/><rect x="22" y="602" width="25.0" height="17" rx="8.5" fill="#2e7d4f" stroke="none" stroke-width="1.2"/><text x="34.5" y="615.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">c7</text><text x="54.0" y="619.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Weight precision</text><text x="22" y="642.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">What do 4-bit weights save against</text><text x="22" y="657.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">8-bit?</text><text x="22" y="682.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">fp8 or nvfp4; batch 8, 64; context</text><text x="22" y="697.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">1k, 16k; B200 only</text><line x1="22" y1="731" x2="256" y2="731" stroke="#d0d7de" stroke-width="1"/><text x="22" y="747.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">48 runs · Section 4.8</text><rect x="281" y="590" width="258" height="166" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/><rect x="293" y="602" width="25.0" height="17" rx="8.5" fill="#2e7d4f" stroke="none" stroke-width="1.2"/><text x="305.5" y="615.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">c8</text><text x="325.0" y="619.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Simulated agent</text><text x="293" y="642.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">What does a workload that re-reads</text><text x="293" y="657.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">a growing context cost?</text><text x="293" y="682.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">One agent, or 5 to 8 together;</text><text x="293" y="697.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">context from 10,240 tokens, 2,048</text><text x="293" y="712.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">more per step</text><line x1="293" y1="731" x2="527" y2="731" stroke="#d0d7de" stroke-width="1"/><text x="293" y="747.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">36 runs · Section 4.9</text><rect x="552" y="590" width="258" height="166" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/><rect x="564" y="602" width="57.5" height="17" rx="8.5" fill="#2e7d4f" stroke="none" stroke-width="1.2"/><text x="592.75" y="615.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">c9, c9b</text><text x="628.5" y="619.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">KV-cache pressure</text><text x="564" y="642.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">What happens past the memory for</text><text x="564" y="657.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">stored context?</text><text x="564" y="682.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">Batch 12 to 32 at 16k context;</text><text x="564" y="697.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">memory offered 90% or 70%;</text><text x="564" y="712.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">Llama-3.3-70B on B200</text><line x1="564" y1="731" x2="798" y2="731" stroke="#d0d7de" stroke-width="1"/><text x="564" y="747.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">20 runs · Section 4.10</text></svg>