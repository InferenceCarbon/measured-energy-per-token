[project]
name = "inferencecarbon-meter"
version = "0.1.0"
description = "Metering harness for the InferenceCarbon per-token energy calibration programme"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15",
    "pandas>=2.1",
    "pyyaml>=6",
    "httpx>=0.27",
    "nvidia-ml-py>=12",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# Installed on the pod by bootstrap.sh; pinned there, not here.
pod = [
    "vllm",
    "zeus-ml",
]
dev = [
    "pytest>=8",
]

# vLLM loads this in every worker process; it is inert unless ICM_MOE_HOOK=1.
[project.entry-points."vllm.general_plugins"]
icm_moe_hook = "meter.moe_hook:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meter*", "analysis*", "outside*", "estimator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
